[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scientisttwo"
version = "0.1.0"
description = "Faithful reimplementation of ScientistTwo (arXiv:2609.19644): closed-loop multi-agent autonomous research"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
scientisttwo = "scientisttwo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
# async tests use asyncio.run(...) — no pytest-asyncio dependency

[tool.ruff]
line-length = 110
target-version = "py311"
